name: Release plugin from tag

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Extract version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            VERSION="${{ github.ref }}" 
            VERSION="${VERSION#refs/tags/v}"
          else
            # For non-tag builds, use commit sha
            VERSION="0.0.0-${{ github.sha }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Build plugin
        run: |
          make plugin
          if [ $? -ne 0 ]; then
            echo "Build failed!"
            exit 1
          fi

      - name: ⬆️ Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/dss-plugin-linkup-${{ steps.get_version.outputs.VERSION }}.zip
